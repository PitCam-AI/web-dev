{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #6C7568; /* solid green-gray matching sidebar */
            color: #F2F4FF;
        }
        .card {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="card shadow-lg">
        <div class="card-body">
            <div class="text-center">
                <img src="{% static 'pages/pitcam_logo.png' %}" alt="Logo"
                     class="mb-3 border rounded-circle"
                     style="max-width: 110px; border-width: 2px;">
            </div>
            <h2 class="text-center mb-4" style="color: #6C7568;">Login</h2>
            <form id="signin-form">
                <div class="mb-3">
                    <input type="text" id="username" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p id="signin-message" class="mt-3 text-center"></p>
            <div class="text-center mt-3">
                <p class="mb-1" style="color: #6C7568;">Don't have an account?</p>
                <a href="{% url 'pages:create_acc' %}" class="btn btn-outline-secondary">Create Account</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
